name: early-access

on:
  workflow_dispatch:
    inputs:
      currentDevelopmentVersion:
        description: Current development version (for example, 0.1.0-dev)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: early-access-${{ github.repository }}
  cancel-in-progress: false

env:
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP }}

jobs:
  setup:
    name: Validate development version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Validate version
        id: resolve
        env:
          VERSION: ${{ inputs.currentDevelopmentVersion }}
        shell: bash
        run: |
          # Reserve space for the early-access and architecture suffixes.
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.-]{0,106}$ ]]; then
            echo "Version must start with a digit and use only letters, digits, dots, or hyphens (107 characters maximum)" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            container: true
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            container: true
          - os: macos-15-intel
            platform: macos-x86_64
            container: false
          - os: macos-15
            platform: macos-aarch64
            container: false
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: make test
      - name: Build and package release binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: make release-archive
      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rhaf-portal-operator-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Login to container registry
        if: matrix.container
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push container image
        if: matrix.container
        run: |
          make build-image CONTAINER_TOOL=docker PUSH=true \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:${VERSION}-early-access"
          make build-image CONTAINER_TOOL=docker PUSH=true \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:early-access"

  create-manifests:
    name: Publish multi-architecture container manifest
    needs: [setup, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Create and push multi-architecture manifest
        run: |
          make build-image-manifest CONTAINER_TOOL=docker \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:${VERSION}-early-access"
          make build-image-manifest CONTAINER_TOOL=docker \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:early-access"

  publish:
    name: Publish rolling early-access release
    needs: [setup, build, create-manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: rhaf-portal-operator-*
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Update rolling GitHub release
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/early-access" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/early-access" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/early-access -f sha="$GITHUB_SHA"
          fi
          printf 'Development build %s from commit %s.\n' "$VERSION" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          if gh release view early-access >/dev/null 2>&1; then
            # Remove old versioned archives before uploading this build.
            gh release view early-access --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
            while IFS= read -r asset; do
              gh release delete-asset early-access "$asset" --yes
            done < "$RUNNER_TEMP/release-assets.txt"
            gh release edit early-access --title "RHAF Portal Operator ${VERSION} early access" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
            gh release upload early-access dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create early-access dist/*.tar.gz dist/checksums.txt \
              --verify-tag --prerelease --latest=false \
              --title "RHAF Portal Operator ${VERSION} early access" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
