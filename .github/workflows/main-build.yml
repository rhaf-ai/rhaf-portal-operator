name: Build Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
      - ci-*
    paths-ignore:
      - '**.md'
      - .claude/**
      - .github/dependabot.yml
      - docs/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP }}
  # Release and CI branches publish under their own names.
  IMAGE_VERSION: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test manifest publication script
        run: make test-image-manifest
      - name: Check formatting
        run: make fmt-check
      - name: Verify generated artifacts
        run: |
          make generate manifests
          git diff --exit-code
      - name: Check code quality and vulnerabilities
        run: make check

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Login to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push container image
        run: |
          make build-image CONTAINER_TOOL=docker PUSH=true \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:${IMAGE_VERSION}"

  create-manifests:
    name: Publish multi-architecture container manifest
    needs: build
    runs-on: ubuntu-latest
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to container registry
        run: |
          printf '%s' "$QUAY_PASSWORD" | podman login \
            --username "$QUAY_USERNAME" --password-stdin \
            "$CONTAINER_REGISTRY"
      - name: Create and push multi-architecture manifest
        run: |
          make build-image-manifest \
            IMAGE_TAG="${CONTAINER_REGISTRY}/${CONTAINER_GROUP}/rhaf-portal-operator:${IMAGE_VERSION}"
