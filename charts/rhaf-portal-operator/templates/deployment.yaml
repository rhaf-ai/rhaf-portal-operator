apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rhaf-portal-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "rhaf-portal-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rhaf-portal-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rhaf-portal-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "rhaf-portal-operator.serviceAccountName" . }}
      containers:
        - name: manager
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --watch-namespace={{ .Release.Namespace }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
