apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "rhaf-portal-operator.fullname" . }}
rules:
  - apiGroups:
      - rhaf.ai.redhat.com
    resources:
      - rhafmcpservers
      - rhafportalcores
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - rhaf.ai.redhat.com
    resources:
      - rhafmcpservers/status
      - rhafportalcores/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - rhaf.ai.redhat.com
    resources:
      - rhafmcpservers/finalizers
      - rhafportalcores/finalizers
    verbs:
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rhaf-portal-operator.fullname" . }}-workload
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
